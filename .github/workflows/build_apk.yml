name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install Flet
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build APK
        run: flet build apk --project "shield-ai" --org "com.shield.ai" --product "Shield AI" --include-packages httpx

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shield-AI-APK
          path: build/apk/*.apk
