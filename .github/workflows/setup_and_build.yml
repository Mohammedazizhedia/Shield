name: Setup Shield & Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. ⭐ الأهم: Java 17 أولاً قبل أي أمر gradle
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 4. توليد ملفات المشروع
      - name: Generate all project files
        run: python setup_project.py

      # 5. توليد Gradle Wrapper بإصدار متوافق
      - name: Generate Gradle Wrapper
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.5-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/
          /tmp/gradle-8.5/bin/gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          echo "✅ Gradle wrapper generated with JDK 17"

      # 6. رفع الملفات للمستودع
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "Auto-generate Shield project files"
          git push

      # 7. بناء APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # 8. رفع APK
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shield-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
