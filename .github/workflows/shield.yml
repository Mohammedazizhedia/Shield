name: Run Shield Script

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  run-shield:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run shield.py
        run: python shield.py
